name: Godot headless checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Publish the checked Web release to GitHub Pages (main only)
        type: boolean
        default: false
  push:
    branches: [main, 'codex/**']
concurrency:
  group: check-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  queue: max
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish_pages: ${{ steps.pages.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select Pages publication
        id: pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_pages)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # An old rerun must not roll back newer game changes. Docs can safely advance main.
          paths=(. ':(exclude)docs/**' ':(exclude)README.md' ':(exclude)AGENTS.md')
          if ! git diff --quiet HEAD origin/main -- "${paths[@]}"; then
            echo "A newer main changes the build. Skipping Pages."
          elif [[ -n "$BEFORE" ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null &&
               git diff --quiet "$BEFORE" HEAD -- "${paths[@]}"; then
            echo "Documentation-only push. Skipping Pages."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the pinned official Godot binary
        shell: bash
        run: bash scripts/release/setup.sh editor
      - name: Import, test the scene, and run headless
        run: bash scripts/check.sh
      - name: Export Android and Web
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/stack-attack-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/stack-attack-config
          XDG_CACHE_HOME: ${{ runner.temp }}/stack-attack-cache
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.1.0/apksigner"
          bash scripts/release/setup.sh templates
          python3 scripts/create_debug_key.py "$RUNNER_TEMP/stack-attack-debug-signing"
          source "$RUNNER_TEMP/stack-attack-debug-signing/debug-signing.env"
          echo "::add-mask::$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          settings = Path(os.environ['XDG_CONFIG_HOME']) / 'godot/editor_settings-4.7.tres'
          values = {
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
              'export/android/android_sdk_path': os.environ['ANDROID_HOME'],
              'export/android/debug_keystore': os.environ['GODOT_ANDROID_KEYSTORE_DEBUG_PATH'],
          }
          settings.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' +
              ''.join(f'{key} = {json.dumps(value)}\n' for key, value in values.items()) +
              'export/android/shutdown_adb_on_exit = false\n')
          PY
          bash scripts/export.sh all
      - name: Rehearse release with a disposable certificate
        if: github.event_name == 'pull_request'
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
          XDG_DATA_HOME: ${{ runner.temp }}/stack-attack-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/stack-attack-config
          XDG_CACHE_HOME: ${{ runner.temp }}/stack-attack-cache
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 scripts/release/test_publish.py
          bash scripts/release/check_build.sh 1.2.3 "$(git rev-parse HEAD)"
          bash scripts/release/test_signing.sh 1.2.3
      - name: Build and smoke-test the Pages Web release
        if: github.event_name == 'pull_request' || steps.pages.outputs.publish == 'true'
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
          XDG_DATA_HOME: ${{ runner.temp }}/stack-attack-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/stack-attack-config
          XDG_CACHE_HOME: ${{ runner.temp }}/stack-attack-cache
        run: bash scripts/build_pages.sh
      - name: Upload the checked Web release
        if: steps.pages.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages
      - name: Package downloads
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_pages
        shell: bash
        run: |
          mkdir -p build/delivery
          cp build/android/stack-attack-prototype-debug.apk build/delivery/
          cp build/logs/android-signature.log build/logs/android-metadata.log build/delivery/
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('build/delivery/stack-attack-prototype-web.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('build/web').iterdir()):
                  if path.is_file():
                      archive.write(path, 'web/' + path.name)
              archive.writestr('README.txt', 'Extract, then: python3 -m http.server 8765 --directory web\nOpen http://127.0.0.1:8765 (not file://). Requires WebGL 2.\n')
          PY
          git rev-parse HEAD > build/delivery/source-commit.txt
          (cd build/delivery && sha256sum stack-attack-prototype-debug.apk stack-attack-prototype-web.zip > SHA256SUMS.txt)
          cat > build/delivery/TEST-ONLY.txt <<'TXT'
          First playable prototype. Phone execution and artwork acceptance are pending.
          This CI run uses a NEW ephemeral debug key. A later run will use a different key.
          Uninstall an older test before installing a build signed by another key.
          The signing key and password are NOT included. No release has been published.
          TXT
      - name: Upload downloads
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_pages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stack-attack-prototype-${{ github.sha }}
          path: build/delivery/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  deploy-pages:
    if: github.ref == 'refs/heads/main' && needs.headless.outputs.publish_pages == 'true'
    needs: headless
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked Web release to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-pages:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Play the published build anonymously
        env:
          PAGES_URL: ${{ needs.deploy-pages.outputs.page_url }}
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: bash scripts/with_playwright.sh scripts/check_pages.py "$PAGES_URL" "$GITHUB_SHA"

  release:
    needs: [headless, verify-pages]
    if: >-
      ${{ !cancelled() && github.repository == 'IlyasYOY/stack-attack' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.headless.result == 'success' &&
      (needs.verify-pages.result == 'success' ||
       (needs.headless.outputs.publish_pages != 'true' && needs.verify-pages.result == 'skipped')) }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
