name: Publish Stack Attack
run-name: Release ${{ inputs.version }} from ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer (for example 1.2.3)
        required: true
        type: string

permissions: {}
concurrency:
  group: stack-attack-stable-release
  cancel-in-progress: false
env:
  VERSION: ${{ inputs.version }}
  RELEASE_MAINTAINERS: ${{ vars.RELEASE_MAINTAINERS || '[]' }}

jobs:
  plan:
    if: github.repository == 'IlyasYOY/stack-attack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/release/authorize.sh
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/publish.py plan "$VERSION" "$GITHUB_SHA"

  build:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      apk: ${{ steps.hash.outputs.apk }}
      web: ${{ steps.hash.outputs.web }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/release/authorize.sh
      - run: bash scripts/release/setup.sh editor
      - name: Export and check both platforms
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/data
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash scripts/release/setup.sh templates
          cat > "$XDG_CONFIG_HOME/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/shutdown_adb_on_exit = false
          EOF
          bash scripts/check.sh
          bash scripts/release/check_build.sh "$VERSION" "$GITHUB_SHA"
      - id: hash
        working-directory: build/release
        run: |
          echo "apk=$(sha256sum aligned.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "web=$(sha256sum web.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-${{ github.run_attempt }}
          path: |
            build/release/aligned.apk
            build/release/web.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: android-release
      deployment: false
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      apk: ${{ steps.verify.outputs.apk }}
      certificate: ${{ steps.verify.outputs.certificate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/release/authorize.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: incoming
          merge-multiple: true
      - env:
          APK_HASH: ${{ needs.build.outputs.apk }}
          CERT: ${{ vars.APK_SIGNING_CERT_SHA256 }}
        run: |
          [[ "$CERT" =~ ^[0-9a-f]{64}$ ]]
          echo "$APK_HASH  incoming/aligned.apk" | sha256sum --check
          python3 scripts/release/verify_apk.py incoming/aligned.apk "$VERSION"
      - name: Sign the validated APK
        env:
          APK_SIGNING_KEYSTORE_BASE64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ vars.APK_SIGNING_KEY_ALIAS }}
        run: bash scripts/release/sign.sh incoming/aligned.apk signed.apk
      - id: verify
        env:
          CERT: ${{ vars.APK_SIGNING_CERT_SHA256 }}
        run: |
          python3 scripts/release/verify_apk.py signed.apk "$VERSION" "$CERT"
          echo "certificate=$CERT" >> "$GITHUB_OUTPUT"
          echo "apk=$(sha256sum signed.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-apk-${{ github.run_attempt }}
          path: signed.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APK_SIGNING_CERT_SHA256: ${{ needs.sign.outputs.certificate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/release/authorize.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: incoming
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact }}
          path: verified
          merge-multiple: true
      - name: Verify signed bytes before publication
        env:
          APK_HASH: ${{ needs.sign.outputs.apk }}
          WEB_HASH: ${{ needs.build.outputs.web }}
        run: |
          echo "$APK_HASH  verified/signed.apk" | sha256sum --check
          echo "$WEB_HASH  incoming/web.zip" | sha256sum --check
          python3 scripts/release/verify_apk.py verified/signed.apk "$VERSION" "$APK_SIGNING_CERT_SHA256"
          mv verified/signed.apk "verified/stack-attack-v$VERSION.apk"
          mv incoming/web.zip "verified/stack-attack-v$VERSION-web.zip"
      - name: Stage assets, verify remote checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/publish.py publish "$VERSION" "$GITHUB_SHA" verified
